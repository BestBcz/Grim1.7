# GrimLegacyAC 默认配置
# 目标环境: Spigot 1.7.10 + ProtocolLib
#
# 调参建议:
# 1. 先看 alerts / debug / checks.Speed / checks.Reach / checks.Velocity / checks.Prediction
# 2. pipeline / prediction.budget / adaptive-lag 属于底层参数，不建议频繁大改
# 3. 想降误报，优先调 buffer / punish-vl；不要一上来就把 threshold 拉得特别大

violation-decay-per-second: 0.08

alerts:
  # 是否把报警输出到控制台
  console: true
  # 是否要求管理员先执行 /glac alerts 才能收到服内报警
  require-subscription: false
  # 报警中是否显示触发来源，例如 CLIENT_MOVEMENT / USE_ENTITY_PACKET
  include-source: true
  # 报警中是否显示预算场景标签；平时建议关，排查误报时再开
  include-budget: false
  # 报警详情的最大长度，超过会自动截断
  detail-max-length: 120

protocollib:
  # 1.7.10 推荐保持开启，作为主包前置
  enabled: true
  strict-reflection: false

netty:
  # 仅作为降级路径，不建议把它当成完整替代方案
  inject-on-join: true
  strict-reflection: false

# packet-first 主链路
# 正常情况下 movement / place / dig / combat 都优先走 packet-first。
# Bukkit MoveEvent 只在 packet 数据缺失或 stale 时做兜底。
pipeline:
  # 是否优先使用 packet-first movement pipeline
  packet-first: true
  # 是否保留 Bukkit MoveEvent 兜底
  bukkit-fallback: true
  # 距离上一次 packet movement 超过这个时间，才允许 Bukkit fallback 介入
  bukkit-fallback-stale-nanos: 150000000
  # 旧 onMove fallback。默认关闭，除非你在排查 prediction 缺帧问题
  legacy-onmove-fallback: false
  # prediction 没准备好时，是否运行一套极简 post checks
  minimal-post-on-prediction-miss: true
  minimal-post:
    # 下面这组是 prediction miss 时的保守阈值，不建议频繁调
    thresholds:
      speed-horizontal: 0.85
      speed-max-dy: 0.42
      speed-buffer-scale: 0.35
      speed-buffer: 4.5
      speed-budget-multiplier: 3.0
      fly-air-ticks: 14
      fly-max-dy: 0.035
      fly-slack-multiplier: 30.0
      fly-dy-budget-multiplier: 0.8
      phase-min-overlap-ratio: 0.16
      phase-ratio-budget-multiplier: 0.8
      phase-min-overlap-volume: 0.05
      phase-volume-budget-multiplier: 0.25
      groundspoof-min-ticks: 5
      groundspoof-buffer: 4.0
      groundspoof-slack-multiplier: 40.0
      groundspoof-budget-multiplier: 8.0

exempt:
  # 玩家刚进服时的保护时间
  join-grace-ms: 2500
  # teleport / setback / 珍珠后的短暂豁免
  teleport-grace-ms: 1000
  # 服务端给速度后的短暂豁免
  velocity-grace-ms: 400

prediction:
  # movement packet 超过这个年龄还没被消费，就不再作为有效 prediction 输入
  max-packet-age-nanos: 120000000
  shadow-deviation-threshold: 0.15
  min-moving-horizontal: 0.03
  min-moving-vertical: 0.03
  lag-tolerance: 0.08
  terrain-alert-floor: 0.08
  ice-alert-floor: 0.105
  head-hit-alert-floor: 0.115
  utility-alert-floor: 0.14
  speed-alert-floor: 0.095
  tower-alert-floor: 0.18
  landing-extra-tolerance: 0.12
  landing-alert-floor: 0.22
  lag-small-tolerance: 0.03
  velocity-pending-tolerance: 0.04
  recovery-after-high-fall-ticks: 8
  # 下面这组 budget 是 prediction 主容差来源。
  # 最常改的是: base / recent-velocity / high-fall-recovery / inventory-air / use-item-air
  budget:
    base: 0.060
    recent-velocity: 0.18
    stuck-speed: 0.050
    liquid: 0.065
    near-glitchy-block: 0.045
    point-three: 0.045
    rod-pull: 0.080
    entity-hard-collision: 0.060
    high-fall-recovery: 0.16
    teleport: 0.15
    uneven-ground: 0.05
    snow-layer: 0.06
    partial-ground: 0.04
    ice-ground: 0.07
    head-hit: 0.09
    uneven-fall: 0.08
    inventory-air: 0.05
    use-item-air: 0.05
    air-sprint-jump: 0.03

# Prediction / Speed 的优势累计模型
# threshold 越小越敏感；max-advantage 越小越容易累计到处罚
Simulation:
  threshold: 0.045
  immediate-setback-threshold: 0.30
  max-advantage: 1.2
  max-ceiling: 5.0
  setback-decay-multiplier: 0.98
  linear-decay-per-tick: 0.08

transaction:
  # 1.7.10 下 transaction 是补偿对齐核心，不建议关闭
  enabled: true
  interval-ticks: 20
  max-ack-age-ms: 4000

combat:
  # Reach 回溯窗口上限。高延迟服可以略高，但不要无限加
  backtrack-window-ms: 400
  # 目标刚 teleport / pearl 的宽限时间
  reach-teleport-grace-ms: 500

heuristics:
  window-decay: 0.90

adaptive-lag:
  # RTT 抖动 / TPS 低时，会给部分检查一点额外容差
  jitter-threshold-ms: 40
  min-tps: 18.0
  reach-extra-distance: 0.12
  speed-tolerance-multiplier: 1.35
  speed-small-margin: 0.05
  pending-state-margin: 0.10
  # 旧版兼容日志开关；现在建议改用下面的 debug.budget-breakdown
  compare-log-enabled: false

debug:
  # /glac debug <player> 后，是否输出每帧 pipeline 摘要
  pipeline-summary: true
  # 是否输出 budget 细分日志；只在排查 prediction / lag 误报时开启
  budget-breakdown: false
  # 是否输出 frame context 新旧判定差异；默认关闭，避免刷屏
  frame-context-diff: false
  # debug 详情最大长度，超过会自动截断
  detail-max-length: 160

checks:
  # 通用字段说明:
  # enabled: 是否启用
  # max-vl: 单检查累计 VL 上限
  # setback: 达到处罚条件后是否允许回拉 / 校正
  # buffer / window-weight: 评分累积相关，不熟悉时不要大改
  # punish-vl: 达到该 VL 后执行 punish-commands

  # 速度主检测。1.7.10 里这是最重要也最容易被误调的一项。
  Speed:
    enabled: true
    max-vl: 12.0
    setback: true
    threshold: 0.045
    max-advantage: 0.8
    immediate-setback-threshold: 0.30
    setback-decay-multiplier: 0.98
    linear-decay-per-tick: 0.08
    buffer: 0.45
    window-weight: 1.0
    # 这是 Speed 在 prediction 结果上的额外基础余量，不要改太大
    prediction-base-allowance: 0.08
    punish-vl: 30
    punish-commands:
      - "kick %player% Speed cheat (%check% VL:%vl%)"

  Fly:
    enabled: true
    max-vl: 10.0
    setback: true
    air-ticks-threshold: 10
    max-dy: 0.02
    buffer: 2.0
    window-weight: 1.0
    parabola-error-threshold: 0.03
    parabola-min-samples: 6
    shadow-min-deviation: 0.12
    punish-vl: 26
    punish-commands:
      - "kick %player% Fly cheat (%check% VL:%vl%)"

  Phase:
    enabled: true
    max-vl: 6.0
    setback: true
    buffer: 1.5
    min-overlap-ratio: 0.08
    min-overlap-volume: 0.018
    min-consecutive-ticks: 3
    thin-min-consecutive-ticks: 5
    punish-vl: 18
    punish-commands:
      - "kick %player% Phase cheat (%check% VL:%vl%)"

  # PvP 命中距离。不要只看 Ray-Distance，一起看 combat.backtrack-window-ms。
  Reach:
    enabled: true
    max-vl: 8.0
    Ray-Distance: 3.0
    setback: false
    buffer: 0.5
    window-weight: 1.0
    strafe-sync-extra-margin: 0.05
    hitbox-miss-close-margin: 0.18
    punish-vl: 22
    punish-commands:
      - "kick %player% Reach cheat (%check% VL:%vl%)"

  AutoClicker:
    enabled: true
    max-vl: 10.0
    max-cps: 17
    max-flat-jitter-ms: 2
    setback: false
    buffer: 1.5
    punish-vl: 25
    punish-commands:
      - "kick %player% AutoClicker (%check% VL:%vl%)"

  NoFall:
    enabled: true
    max-vl: 6.0
    setback: false
    min-air-ticks: 6
    buffer: 1.5
    punish-vl: 16
    punish-commands:
      - "kick %player% NoFall cheat (%check% VL:%vl%)"

  KillAura:
    enabled: true
    max-vl: 7.0
    setback: false
    snap-threshold: 55.0
    wall-buffer: 2.3
    buffer: 2.0
    multi-target-buffer: 3.0
    repeated-rotation-buffer: 2.25
    punish-vl: 20
    punish-commands:
      - "kick %player% KillAura cheat (%check% VL:%vl%)"

  # 计时类检测。误报先看 max-moves-per-second / balance-threshold-ms。
  Timer:
    enabled: true
    max-vl: 8.0
    setback: false
    max-moves-per-second: 26
    buffer: 2.0
    balance-threshold-ms: 65.0
    max-credit-ms: -250.0
    idle-packet-weight: 0.0
    look-only-weight: 0.35
    idle-decay-multiplier: 0.82
    look-rotation-threshold: 0.5
    minimum-look-sample-ms: 8.0
    punish-vl: 20
    punish-commands:
      - "kick %player% Timer cheat (%check% VL:%vl%)"

  # 击退窗口。高延迟服主要看 tx-window-max-ms / min-response-ratio-* / min-score-to-flag。
  Velocity:
    enabled: true
    max-vl: 8.0
    setback: true
    threshold: 0.001
    max-advantage: 1.0
    immediate-setback-threshold: 0.10
    setback-decay-multiplier: 0.999
    max-ceiling: 4.0
    tx-window-max-ms: 500
    delayed-window-ticks: 3
    min-samples: 2
    window-ticks: 8
    min-expected-xz: 0.08
    min-response-ratio-xz: 0.40
    min-response-ratio-y: 0.25
    buffer: 1.2
    window-weight: 1.0
    min-score-to-flag: 1.2
    punish-vl: 20
    punish-commands:
      - "kick %player% Velocity cheat (%check% VL:%vl%)"

  Jesus:
    enabled: true
    max-vl: 8.0
    setback: true
    max-water-speed: 0.18
    buffer: 0.25
    punish-vl: 20
    punish-commands:
      - "kick %player% Jesus cheat (%check% VL:%vl%)"

  FastPlace:
    enabled: true
    max-vl: 8.0
    setback: false
    max-place-per-second: 14
    buffer: 1.5
    punish-vl: 20
    punish-commands:
      - "kick %player% FastPlace cheat (%check% VL:%vl%)"

  FastBreak:
    enabled: true
    max-vl: 8.0
    setback: false
    max-break-per-second: 12
    buffer: 1.5
    punish-vl: 20
    punish-commands:
      - "kick %player% FastBreak cheat (%check% VL:%vl%)"

  FastUse:
    enabled: true
    max-vl: 8.0
    setback: false
    max-consume-per-second: 2
    buffer: 1.0
    punish-vl: 14
    punish-commands:
      - "kick %player% FastUse cheat (%check% VL:%vl%)"

  InventoryMove:
    enabled: true
    max-vl: 8.0
    setback: false
    max-move: 0.12
    open-grace-ms: 1500
    close-grace-ms: 250
    buffer: 0.2
    window-weight: 1.0
    punish-vl: 18
    punish-commands:
      - "kick %player% InventoryMove cheat (%check% VL:%vl%)"

  # Prediction 是底层主检查。若误报高，先看上面的 prediction.budget，而不是先把这里拉大。
  Prediction:
    enabled: true
    max-vl: 10.0
    setback: true
    buffer: 1.2
    window-weight: 1.0
    punish-vl: 25
    punish-commands:
      - "kick %player% Prediction cheat (%check% VL:%vl%)"

  NoSlow:
    enabled: true
    max-vl: 8.0
    setback: false
    slow-factor: 0.2
    min-using-ticks: 2
    min-consecutive-violation-ticks: 2
    slot-switch-grace-ticks: 2
    prediction-min-deviation-threshold: 0.035
    buffer: 0.4
    window-weight: 1.0
    punish-vl: 18
    punish-commands:
      - "kick %player% NoSlow cheat (%check% VL:%vl%)"
    use-packet-max-age-ms: 250

  AimProcessor:
    enabled: true
    max-vl: 999.0
    setback: false

  AimModulo360:
    enabled: true
    max-vl: 8.0
    setback: false
    buffer: 1.25
    punish-vl: 18
    punish-commands:
      - "kick %player% Aim cheat (%check% VL:%vl%)"

  AimDuplicateLook:
    enabled: true
    max-vl: 8.0
    setback: false
    buffer: 1.25
    punish-vl: 18
    punish-commands:
      - "kick %player% Aim cheat (%check% VL:%vl%)"

  RotationBreak:
    enabled: true
    max-vl: 8.0
    setback: false
    max-reach: 5.2
    buffer: 1.25
    punish-vl: 20
    punish-commands:
      - "kick %player% RotationBreak (%check% VL:%vl%)"

  FarBreak:
    enabled: true
    max-vl: 8.0
    setback: false
    max-distance: 5.1
    buffer: 1.25
    punish-vl: 20
    punish-commands:
      - "kick %player% FarBreak (%check% VL:%vl%)"

  AirLiquidBreak:
    enabled: true
    max-vl: 8.0
    setback: false
    buffer: 1.0
    punish-vl: 16
    punish-commands:
      - "kick %player% AirLiquidBreak (%check% VL:%vl%)"

  MultiBreak:
    enabled: false
    max-vl: 8.0
    setback: false
    max-interval-ms: 25
    buffer: 1.25
    punish-vl: 18
    punish-commands:
      - "kick %player% MultiBreak (%check% VL:%vl%)"

  DuplicateRotPlace:
